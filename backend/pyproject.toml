[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evalpilot-backend"
version = "0.1.0"
description = "EvalPilot backend: run orchestration, storage, and tool layer for AI regression evaluation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "httpx>=0.27",
    "haystack-ai>=3.1,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["evalpilot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
