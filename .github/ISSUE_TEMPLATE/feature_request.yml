name: Feature request
description: Propose a product or integration improvement
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Which real workflow is blocked or slow?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Verification idea
      description: How could the result be measured or accepted?
