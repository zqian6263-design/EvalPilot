name: P4 Release

on:
  push:
    tags:
      - "evalpilot-p4-*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build release archive
        shell: pwsh
        run: ./scripts/build-release.ps1 -Version "${{ github.ref_name }}"
      - name: Upload release artifact
        uses: actions/upload-artifact@v5
        with:
          name: evalpilot-p4-release
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.sha256 --title "$GITHUB_REF_NAME" --generate-notes
